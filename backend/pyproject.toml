[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gymdb"
version = "1.0.0"
description = "Deterministic gym discovery and enrichment backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.128.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "python-dotenv==1.2.1",
    "python-jose==3.5.0",
    "requests==2.32.5",
    "SQLAlchemy==2.0.45",
    "psycopg==3.3.2",
    "psycopg-binary==3.3.2",
    "uvicorn==0.40.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "mypy==1.18.2",
    "pytest==9.0.2",
    "pytest-env==1.2.0",
    "ruff==0.13.2",
    "types-python-jose==3.5.0.20250531",
    "types-requests==2.32.4.20250913",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["gymdb*"]

[tool.setuptools.package-data]
gymdb = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
check_untyped_defs = true
no_implicit_optional = true
mypy_path = ["src"]
explicit_package_bases = true
exclude = ["^tests/"]
