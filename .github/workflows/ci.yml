name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: gymdb_test
          POSTGRES_USER: gymdb_test
          POSTGRES_PASSWORD: gymdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gymdb_test -d gymdb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify checked-in OpenAPI snapshot
        run: |
          python scripts/export_openapi.py --out openapi.generated.json
          python -c "import json, pathlib, sys; live = json.loads(pathlib.Path('openapi.generated.json').read_text(encoding='utf-8')); checked = json.loads(pathlib.Path('openapi.json').read_text(encoding='utf-8')); sys.exit(0 if live == checked else 1)"

      - name: Run Ruff
        run: ruff check .

      - name: Run MyPy
        run: mypy src/gymdb api

      - name: Run Pytest
        run: python -m pytest

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify generated API client
        run: npm run verify:api-client

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build
