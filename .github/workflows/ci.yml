name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scans:
    name: Security Scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/pyproject.toml

      - name: Audit backend Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pip-audit
          pip-audit --strict

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit frontend production dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high --omit=dev

  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: gymdb_test
          POSTGRES_USER: gymdb_test
          POSTGRES_PASSWORD: gymdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gymdb_test -d gymdb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify checked-in OpenAPI snapshot
        run: |
          python scripts/export_openapi.py --out openapi.generated.json
          git diff --no-index --exit-code -- openapi.json openapi.generated.json

      - name: Verify migrations apply cleanly
        env:
          PGPASSWORD: gymdb_test
        run: |
          chmod +x ../scripts/migrate.sh
          ../scripts/migrate.sh "postgresql://gymdb_test:gymdb_test@localhost:5432/gymdb_test"
          EXPECTED=$(find ../database/schema -maxdepth 1 -type f -name '[0-8][0-9][0-9]_*.sql' | wc -l)
          APPLIED=$(psql "postgresql://gymdb_test:gymdb_test@localhost:5432/gymdb_test" -tAqc "SELECT COUNT(*) FROM public._migrations")
          test "$EXPECTED" -eq "$APPLIED"

      - name: Run Ruff
        run: ruff check .

      - name: Run MyPy
        run: mypy src/gymdb api

      - name: Run Pytest with coverage
        run: python -m pytest --cov=api --cov=src/gymdb --cov-report=term-missing --cov-report=xml:coverage.xml

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify generated API client
        run: npm run verify:api-client

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Run Playwright
        run: npm run test:e2e
